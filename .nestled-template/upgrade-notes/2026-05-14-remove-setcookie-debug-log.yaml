id: 2026-05-14-remove-setcookie-debug-log
title: Remove SetCookie Debug Log
priority: low
area: auth
type: cleanup
delivery: code-patch

intent: >
  The setCookie method in AuthService must not log cookie configuration details
  (name, domain, secure, sameSite) to stdout on every login.

why: >
  A console.log left over from debugging was printing cookie configuration on every
  login call. Beyond being noise, it exposes security-relevant settings (secure flag,
  sameSite policy, domain) in plain-text server logs.

affectedPaths:
  - libs/api/custom/src/lib/plugins/auth/auth.service.ts

packageReleases: []

skipIf:
  - setCookie no longer contains a console.log statement.

verification:
  - pnpm lint
  - grep -r "console.log" libs/api/custom/src/lib/plugins/auth/auth.service.ts && exit 1 || echo "clean"

agentHints:
  - Find the setCookie method in AuthService and remove any console.log calls inside it.
  - The method should only call res?.cookie(...) and return the result.
