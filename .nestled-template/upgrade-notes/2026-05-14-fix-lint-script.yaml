id: 2026-05-14-fix-lint-script
title: Fix pnpm lint script — replace removed nx workspace-lint
priority: normal
area: infra
type: correctness
delivery: code-patch

intent: >
  The root package.json lint script must use "nx run-many -t lint" to run ESLint
  across all workspace projects. The legacy "nx workspace-lint" command and bare
  "nx lint" (targeting the root project) no longer work in nx 15+.

why: >
  nx removed the built-in workspace-lint command. Bare "nx lint" targets the root
  project, which has no lint target, so it fails immediately. Both commands were
  present in the script from an older nx setup and have been broken since the
  upgrade to nx 22.

affectedPaths:
  - package.json

packageReleases: []

skipIf:
  - The lint script in package.json already uses "nx run-many -t lint"

verification:
  - pnpm lint

agentHints:
  - Change the "lint" script in package.json from "nx workspace-lint && nx lint"
    (or any variation) to "nx run-many -t lint".
  - Do not add a workspace-lint target to project.json — it is not needed.
