id: 2026-05-14-fix-lint-script
title: Fix pnpm lint and test scripts — replace bare nx commands with nx run-many
priority: normal
area: infra
type: correctness
delivery: code-patch

intent: >
  The root package.json lint and test scripts must use "nx run-many -t <target>"
  to run across all workspace projects. Bare "nx lint" and "nx test" (which target
  the root project) and the removed "nx workspace-lint" command no longer work in
  nx 15+.

why: >
  nx removed the built-in workspace-lint command. Bare "nx lint" and "nx test"
  target the root project (@nestled-template/source), which has no lint or test
  targets defined, causing both scripts to fail immediately. These were leftover
  from an older nx setup and have been broken since the upgrade to nx 22.

affectedPaths:
  - package.json

packageReleases: []

skipIf:
  - The lint script in package.json already uses "nx run-many -t lint"
  - The test script in package.json already uses "nx run-many -t test"

verification:
  - pnpm lint

agentHints:
  - Change the "lint" script in package.json from "nx workspace-lint && nx lint"
    (or any variation) to "nx run-many -t lint".
  - Change the "test" script in package.json from "nx test" to "nx run-many -t test".
  - Do not add workspace-lint, lint, or test targets to the root project.json.
