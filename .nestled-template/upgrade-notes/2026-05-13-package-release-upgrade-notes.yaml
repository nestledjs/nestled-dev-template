id: 2026-05-13-package-release-upgrade-notes
title: Package Release Upgrade Notes
priority: normal
area: infra
type: infra
delivery: code-patch

intent: >
  Distinguish downstream code-patch upgrades from published package upgrades so changes
  to Nestled libraries are consumed through dependency version bumps instead of copied
  source patches.

why: >
  This repository develops @nestledjs/data-browser and @nestledjs/shared-components as
  published packages. Treating those source changes like template code patches causes
  downstream projects to duplicate library internals instead of consuming the released
  package versions.

affectedPaths:
  - .nestled-template/**
  - scripts/create-upgrade-note.ts
  - scripts/validate-upgrade-notes.ts
  - README.md
  - AGENTS.md
  - CLAUDE.md

packageReleases: []

skipIf:
  - Project does not keep local template upgrade-note tooling or consumes upgrade metadata from this template repository directly.

verification:
  - pnpm template:validate-upgrade-notes

agentHints:
  - Add a delivery discriminator with code-patch, package-release, and hybrid modes.
  - Require affectedPaths for code-patch and hybrid notes.
  - Require packageReleases for package-release and hybrid notes.
  - Treat @nestledjs/data-browser and @nestledjs/shared-components changes as package releases unless local downstream code also needs adaptation.
