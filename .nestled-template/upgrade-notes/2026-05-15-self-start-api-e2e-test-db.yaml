id: 2026-05-15-self-start-api-e2e-test-db
title: Self-start API E2E test database
priority: normal
area: infra
type: correctness
delivery: code-patch

intent: >
  Running the api-e2e test target through Nx should use the same Docker-backed
  test database URL as the test DB helper and should start that database
  automatically when it is not already accessible.

why: >
  The root pnpm test command includes api-e2e:test. Previously that target
  defaulted to a local user-owned Postgres URL and the test DB helper checked a
  stale container name, so fresh environments failed before any E2E tests ran.

affectedPaths:
  - apps/api-e2e/**
  - scripts/test-db.sh

packageReleases: []

skipIf:
  - Project has replaced api-e2e with a different E2E runner or database setup.
  - Project intentionally requires a manually managed TEST_DATABASE_URL for E2E tests.

verification:
  - pnpm lint
  - pnpm test:db:stop
  - pnpm nx run api-e2e:test --skip-nx-cache
  - pnpm test

agentHints:
  - Keep TEST_DATABASE_URL overrides respected when downstream projects provide one.
  - If the script starts the Docker test database itself, stop only that self-started container on exit.
  - Keep the compose container name in scripts/test-db.sh aligned with .dev/docker-compose.yml.
