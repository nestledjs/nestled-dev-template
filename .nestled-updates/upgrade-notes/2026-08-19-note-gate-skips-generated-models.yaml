id: 2026-08-19-note-gate-skips-generated-models
title: The upgrade-note gate no longer demands a note for regenerated model output
priority: ignore
area: infra
type: cleanup

intent: >
  Nothing to apply. `scripts/doctor.ts` no longer treats
  `libs/api/core/models/src/lib/models/**` as a sensitive upgrade path, so regenerating models does
  not by itself require an upgrade note. The gate only ever runs in the source template repositories
  (`isSourceTemplateRepository()`), so no downstream project's doctor behavior changes at all — this
  arrives as template state and needs no action.

why: >
  `db-update` runs the doctor, regenerates via `nx g @nestledjs/generators:models`, then runs the
  doctor again. The second run always saw a rewritten `models.ts` inside the gated
  `libs/api/core/(models|custom|utils|integrations)/` prefix and failed, demanding an upgrade note
  for a file nobody wrote. The routine escape was a `priority: ignore` note per regeneration, which
  is note-history noise standing in for a gate that was matching the wrong thing.

  No coverage is lost. The change that produces this output is `schema.prisma`, which the gate
  matches on its own line — a schema change still demands a note. Gating the generated mirror as
  well made one change demand two. Generated CRUD output (`libs/api/generated-crud/**`) already sat
  outside the gate for exactly this reason; generated model output being inside it was an
  inconsistency, not a decision.

affectedPaths:
  - scripts/doctor.ts

agentHints:
  - >
    The exclusion is a prefix list (`generatedOutputPrefixes`) checked before every other clause, so
    it also wins over the `/guards/`, `/billing/`, `/auth/`, `/rbac/` and `/admin/` substring tests.
    Keep the prefixes exact: `api-core-models.module.ts` sits beside the generated `models/`
    directory, is hand-written, and must stay gated.
  - >
    If a future generator writes into another gated path, add its directory to
    `generatedOutputPrefixes` rather than reaching for a per-regeneration ignore note.
