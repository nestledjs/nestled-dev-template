id: 2026-08-07-admin-custom-build-wiring
title: 'Wire admin-custom into the api project references and Sonar'
priority: ignore
area: infra
type: cleanup
delivery: code-patch

intent: >
  Add libs/api/admin-custom/src to sonar.sources, and a ./libs/api/admin-custom entry to the
  api project's tsconfig references, so the library introduced by the admin-crud boundary batch
  is analysed and listed alongside its siblings.

why: >
  Sonar was not scanning admin-custom at all, which matters because that library exists to hold
  the admin-only workflows that compose generated CRUD — the code most worth analysing. The
  tsconfig reference was raised in review on nestled-template#34.

  priority: ignore because nothing downstream needs to act. A clone that has taken the
  admin-crud boundary batch already has the library; these two files are repo-local build and
  analysis configuration, and both are excluded from the promotion mirror, so a downstream
  project maintains its own copies against its own library list.

  Recorded rather than skipped because every reference in apps/api/tsconfig.json is already
  broken: they resolve relative to apps/api/, so "./libs/api/prisma" points at
  apps/api/libs/api/prisma and tsc reports TS6053 for all eleven pre-existing entries. The new
  entry is added for consistency, not effect. Correcting all twelve to ../../libs/... deserves
  its own change and a check that nothing depends on the current inertness.

affectedPaths:
  - apps/api/tsconfig.json
  - sonar-project.properties

skipIf:
  - Always. Repo-local build and analysis configuration; both files are mirror-excluded.
