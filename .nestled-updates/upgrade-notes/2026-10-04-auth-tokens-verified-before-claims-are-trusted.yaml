id: 2026-10-04-auth-tokens-verified-before-claims-are-trusted
title: Logout and end-emulation verify the token before trusting its claims
priority: high
area: auth
type: security
delivery: code-patch

intent: >
  `AuthService.decodeToken()` is replaced by `verifyToken(token, { ignoreExpiration? })`, which
  returns the claims only when the signature verifies against JWT_SECRET (null otherwise). Every
  caller that acted on a token's claims now uses it:

  1. Logout (`AuthResolver.logout`, a public mutation) reads `{ sessionId, userId }` from the token
  with `verifyToken(token, { ignoreExpiration: true })`: an expired but genuine token can still end
  its own session; a token that does not verify ends nothing. `AuthService.logout(sessionId, userId)`
  now looks the session up first and invalidates it, and records LOGOUT, only when the session
  belongs to that user. A failed lookup propagates (the resolver still clears the cookie in its
  `finally`) instead of invalidating an unchecked session.

  2. `AuthService.endEmulation(token)` verifies the cookie token (expiry enforced) before reading
  `originalAdminId`; an unverifiable token is "Not currently emulating a user".

  3. The resolver's current-session lookups for `changePassword` and `getUserSessions` read the
  session id from a verified token.

why: >
  `jwtService.decode()` checks neither signature nor expiry, so a token's claims are whatever the
  client wrote. Logout is public: a forged token naming another user's session id ended that
  session, and since the audit-records release also wrote a LOGOUT row in that user's name.
  Session ids are random UUIDs, which limits this to someone who has learned one.

  `endEmulation` sits behind the auth guard, but the guard authenticates from the Authorization
  header first while `endEmulation` re-read the cookie and only decoded it. A caller holding a
  genuine emulation token in the header could put a forged token in the cookie naming any admin as
  `originalAdminId` and be issued that admin's session. Only someone already holding an emulation
  token (an admin with emulation rights) can reach this, so the exposure is escalation between
  admins rather than from outside.

  `getUserFromToken` still uses `decode()`: it only ever receives a token this server signed in the
  same response (the `UserToken.user` field), so there is nothing to verify.

affectedPaths:
  - libs/api/custom/src/lib/plugins/auth/auth.service.ts
  - libs/api/custom/src/lib/plugins/auth/auth.service.spec.ts
  - libs/api/custom/src/lib/plugins/auth/auth.resolver.ts
  - libs/api/custom/src/lib/plugins/auth/auth.resolver.spec.ts

packageReleases: []

skipIf:
  - The project has no `decodeToken`/`jwtService.decode()` call whose result decides which session, user or admin an operation acts on.

verification:
  - pnpm exec nx run api-custom:test
  - pnpm exec nx run api:typecheck
  - pnpm exec nestled-doctor

agentHints:
  - >
    grep the API for `jwtService.decode(` and `decodeToken(`. Every call whose claims choose a
    session, user, organization or admin to act on must verify instead. A decode of a token the
    server itself just signed (the `UserToken.user` resolve field) can stay.
  - >
    Keep `ignoreExpiration: true` for logout only. Everywhere else an expired token must be refused.
  - >
    `AuthService.logout` now takes `(sessionId, userId)` and checks ownership before invalidating.
    If the project's logout already went through `SessionService.invalidateSession` directly from the
    resolver, route it through this method rather than adding the check in two places.
  - >
    Mocks: the auth resolver spec's AuthService mock gains `verifyToken` (returning `{ sessionId,
    userId }`) in place of `decodeToken`; service specs that stubbed `jwtService.decode` for
    endEmulation now stub `jwtService.verify`.
