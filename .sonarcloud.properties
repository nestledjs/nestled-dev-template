# =============================================================================
# SonarQube / SonarCloud Analysis Configuration
# =============================================================================
# sonar.projectKey and sonar.organization are set via CI environment variables.
# This file is part of the Nestled template and propagates to all downstream
# projects. Edit the exclusions here; per-project identity lives in CI.

sonar.sourceEncoding=UTF-8

# =============================================================================
# FULL EXCLUSIONS — Auto-generated code (never edit these manually)
# =============================================================================
sonar.exclusions=\
  libs/api/generated-crud/**,\
  libs/shared/sdk/src/generated/**,\
  libs/shared/sdk/src/lib/database-models.ts,\
  libs/api/prisma/src/lib/prisma-generated/**,\
  libs/api/prisma/src/lib/schemas/migrations/**,\
  libs/api/core/models/src/lib/models/models.ts,\
  libs/api/core/models/src/lib/models/enums.ts,\
  **/*.md

sonar.cpd.exclusions=\
  libs/api/generated-crud/**,\
  libs/api/core/models/src/lib/models/models.ts,\
  libs/api/core/models/src/lib/models/enums.ts,\
  libs/shared/sdk/src/generated/**,\
  libs/shared/sdk/src/lib/database-models.ts,\
  libs/api/prisma/src/lib/prisma-generated/**,\
  **/*.spec.ts,\
  **/*.spec.tsx

sonar.coverage.exclusions=\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.stories.ts,\
  **/*.stories.tsx,\
  **/jest.config.ts,\
  **/jest.config.js,\
  **/vite.config.ts,\
  **/jest.setup.ts,\
  **/tailwind.config.ts,\
  **/tailwind.config.js,\
  libs/api/generated-crud/**,\
  libs/shared/sdk/src/generated/**,\
  libs/api/prisma/src/lib/prisma-generated/**

# =============================================================================
# RULE SUPPRESSIONS — Spec and story files
# Rules that are systematically noisy in tests but still meaningful in
# production code are suppressed here rather than disabled project-wide.
# Real bugs (e.g. S6440 — React hooks violations) are intentionally kept.
# =============================================================================
sonar.issue.ignore.multicriteria=\
  spec-complexity-ts,\
  spec-complexity-tsx,\
  spec-nesting-ts,\
  spec-nesting-tsx,\
  spec-useless-assign-ts,\
  spec-useless-assign-tsx,\
  spec-unnecessary-cast-ts,\
  spec-unnecessary-cast-tsx,\
  spec-remove-child-ts,\
  spec-remove-child-tsx,\
  spec-fn-scope-ts,\
  spec-fn-scope-tsx,\
  spec-accessibility-tsx,\
  spec-label-control-ts,\
  spec-label-control-tsx,\
  stories-error-name,\
  stories-accessibility

# Cognitive complexity — complex test setups are acceptable
sonar.issue.ignore.multicriteria.spec-complexity-ts.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.spec-complexity-ts.resourceKey=**/*.spec.ts
sonar.issue.ignore.multicriteria.spec-complexity-tsx.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.spec-complexity-tsx.resourceKey=**/*.spec.tsx

# Deep nesting — describe/it blocks legitimately nest
sonar.issue.ignore.multicriteria.spec-nesting-ts.ruleKey=typescript:S2004
sonar.issue.ignore.multicriteria.spec-nesting-ts.resourceKey=**/*.spec.ts
sonar.issue.ignore.multicriteria.spec-nesting-tsx.ruleKey=typescript:S2004
sonar.issue.ignore.multicriteria.spec-nesting-tsx.resourceKey=**/*.spec.tsx

# Useless assignment — common pattern: const x = render(...) then reassign in later test
sonar.issue.ignore.multicriteria.spec-useless-assign-ts.ruleKey=typescript:S1854
sonar.issue.ignore.multicriteria.spec-useless-assign-ts.resourceKey=**/*.spec.ts
sonar.issue.ignore.multicriteria.spec-useless-assign-tsx.ruleKey=typescript:S1854
sonar.issue.ignore.multicriteria.spec-useless-assign-tsx.resourceKey=**/*.spec.tsx

# Unnecessary type assertions — TypeScript tests often need explicit casts for expect()
sonar.issue.ignore.multicriteria.spec-unnecessary-cast-ts.ruleKey=typescript:S4325
sonar.issue.ignore.multicriteria.spec-unnecessary-cast-ts.resourceKey=**/*.spec.ts
sonar.issue.ignore.multicriteria.spec-unnecessary-cast-tsx.ruleKey=typescript:S4325
sonar.issue.ignore.multicriteria.spec-unnecessary-cast-tsx.resourceKey=**/*.spec.tsx

# prefer remove() over removeChild() — DOM teardown in tests uses older patterns
sonar.issue.ignore.multicriteria.spec-remove-child-ts.ruleKey=typescript:S7762
sonar.issue.ignore.multicriteria.spec-remove-child-ts.resourceKey=**/*.spec.ts
sonar.issue.ignore.multicriteria.spec-remove-child-tsx.ruleKey=typescript:S7762
sonar.issue.ignore.multicriteria.spec-remove-child-tsx.resourceKey=**/*.spec.tsx

# Function scope — test helper functions defined inline are intentional
sonar.issue.ignore.multicriteria.spec-fn-scope-ts.ruleKey=typescript:S7721
sonar.issue.ignore.multicriteria.spec-fn-scope-ts.resourceKey=**/*.spec.ts
sonar.issue.ignore.multicriteria.spec-fn-scope-tsx.ruleKey=typescript:S7721
sonar.issue.ignore.multicriteria.spec-fn-scope-tsx.resourceKey=**/*.spec.tsx

# Accessibility rules — not enforced in test files
sonar.issue.ignore.multicriteria.spec-accessibility-tsx.ruleKey=typescript:S6848
sonar.issue.ignore.multicriteria.spec-accessibility-tsx.resourceKey=**/*.spec.tsx

# Form label association — not enforced in test files
sonar.issue.ignore.multicriteria.spec-label-control-ts.ruleKey=typescript:S6853
sonar.issue.ignore.multicriteria.spec-label-control-ts.resourceKey=**/*.spec.ts
sonar.issue.ignore.multicriteria.spec-label-control-tsx.ruleKey=typescript:S6853
sonar.issue.ignore.multicriteria.spec-label-control-tsx.resourceKey=**/*.spec.tsx

# "Error" variable name — Storybook convention for error-state stories
sonar.issue.ignore.multicriteria.stories-error-name.ruleKey=typescript:S2137
sonar.issue.ignore.multicriteria.stories-error-name.resourceKey=**/*.stories.tsx

# Accessibility — not enforced in Storybook stories
sonar.issue.ignore.multicriteria.stories-accessibility.ruleKey=typescript:S6848
sonar.issue.ignore.multicriteria.stories-accessibility.resourceKey=**/*.stories.tsx
