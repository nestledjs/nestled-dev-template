query __AdminPlan($planId: String!) {
  plan(planId: $planId) {
    ...__AdminPlanDetails
  }
}

query __AdminPlans($input: ListPlanInput) {
  plans(input: $input) {
    ...__AdminPlanList
  }
  counters: plansCount(input: $input) {
    ...CorePagingDetails
  }
}

query __AdminPlanPagination($input: ListPlanInput) {
  counters: plansCount(input: $input) {
    ...CorePagingDetails
  }
}
