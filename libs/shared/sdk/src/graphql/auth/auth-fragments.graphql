fragment UserTokenDetails on UserToken {
  token
  user {
    ...AuthUserDetails
  }
}

fragment AuthUserDetails on User {
  id
  firstName
  lastName
  displayName
  bio
  isSuperAdmin
  emailValidated
  createdAt
  updatedAt
  emails {
    id
    email
    primary
    verified
  }
  phoneNumbers {
    id
    phone
    primary
  }
}