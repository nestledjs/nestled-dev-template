fragment OrganizationList on Organization {
  id
  createdAt
  updatedAt
  name
}

fragment OrganizationDetails on Organization {
  ...OrganizationList
  members {
    id
    userId
    roleId
    user {
      id
      firstName
      lastName
    }
    role {
      id
      name
    }
  }
  roles {
    id
    name
    description
  }
}
