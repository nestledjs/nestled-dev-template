query Upload($uploadId: String!) {
  upload(uploadId: $uploadId) {
    ...UploadDetails
  }
}

query Uploads($input: ListUploadInput) {
  uploads(input: $input) {
    ...UploadList
  }
  counters: uploadsCount(input: $input) {
    ...CorePagingDetails
  }
}

query UploadPagination($input: ListUploadInput) {
  counters: uploadsCount(input: $input) {
    ...CorePagingDetails
  }
}
