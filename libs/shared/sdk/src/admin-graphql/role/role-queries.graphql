query AdminRole($roleId: String!) {
  role(roleId: $roleId) {
    ...AdminRoleDetails
  }
}

query AdminRoles($input: ListRoleInput) {
  roles(input: $input) {
    ...AdminRoleList
  }
  counters: rolesCount(input: $input) {
    ...CorePagingDetails
  }
}

query AdminRolePagination($input: ListRoleInput) {
  counters: rolesCount(input: $input) {
    ...CorePagingDetails
  }
}
