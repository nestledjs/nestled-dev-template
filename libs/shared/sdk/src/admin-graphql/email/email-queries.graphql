query AdminEmail($emailId: String!) {
  email(emailId: $emailId) {
    ...AdminEmailDetails
  }
}

query AdminEmails($input: ListEmailInput) {
  emails(input: $input) {
    ...AdminEmailList
  }
  counters: emailsCount(input: $input) {
    ...CorePagingDetails
  }
}

query AdminEmailPagination($input: ListEmailInput) {
  counters: emailsCount(input: $input) {
    ...CorePagingDetails
  }
}
