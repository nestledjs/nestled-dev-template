fragment AdminSubscriptionList on Subscription {
  id
  createdAt
  updatedAt
  organizationId
  planId
  stripeCustomerId
  stripeSubscriptionId
  stripePriceId
  stripeCurrentPeriodEnd
  status
  organization {
    id
  }
  plan {
    id
  }
}

fragment AdminSubscriptionDetails on Subscription {
  ...AdminSubscriptionList
}
