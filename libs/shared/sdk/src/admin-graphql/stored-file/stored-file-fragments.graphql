fragment AdminStoredFileList on StoredFile {
  id
  createdAt
  updatedAt
  provider
  providerFileId
  folder
  filename
  originalName
  mimeType
  size
  url
  publicUrl
  width
  height
  metadata
  userId
  organizationId
  user {
    id
  }
  organization {
    id
  }
}

fragment AdminStoredFileDetails on StoredFile {
  ...AdminStoredFileList
}
