fragment AdminAddressList on Address {
  id
  createdAt
  updatedAt
  address1
  address2
  city
  region
  postalCode
  addressType
  isPrimary
  countryId
  userId
  organizationId
  country {
    id
  }
  user {
    id
  }
  organization {
    id
  }
}

fragment AdminAddressDetails on Address {
  ...AdminAddressList
}
