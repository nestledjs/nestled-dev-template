query AdminTeam($teamId: String!) {
  team(teamId: $teamId) {
    ...AdminTeamDetails
  }
}

query AdminTeams($input: ListTeamInput) {
  teams(input: $input) {
    ...AdminTeamList
  }
  counters: teamsCount(input: $input) {
    ...CorePagingDetails
  }
}

query AdminTeamPagination($input: ListTeamInput) {
  counters: teamsCount(input: $input) {
    ...CorePagingDetails
  }
}
