query AdminInvite($inviteId: String!) {
  invite(inviteId: $inviteId) {
    ...AdminInviteDetails
  }
}

query AdminInvites($input: ListInviteInput) {
  invites(input: $input) {
    ...AdminInviteList
  }
  counters: invitesCount(input: $input) {
    ...CorePagingDetails
  }
}

query AdminInvitePagination($input: ListInviteInput) {
  counters: invitesCount(input: $input) {
    ...CorePagingDetails
  }
}
