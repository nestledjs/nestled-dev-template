query AdminUser($userId: String!) {
  user(userId: $userId) {
    ...AdminUserDetails
  }
}

query AdminUsers($input: ListUserInput) {
  users(input: $input) {
    ...AdminUserList
  }
  counters: usersCount(input: $input) {
    ...CorePagingDetails
  }
}

query AdminUserPagination($input: ListUserInput) {
  counters: usersCount(input: $input) {
    ...CorePagingDetails
  }
}
