sonar.projectKey=nestledjs_nestled_template
sonar.organization=nestledjs

sonar.sources=.
sonar.exclusions=\
  **/node_modules/**,\
  **/.claude/**,\
  **/dist/**,\
  **/coverage/**,\
  **/.nx/**,\
  **/generated/**,\
  libs/shared/sdk/src/generated/**,\
  libs/api/generated-crud/**,\
  **/prisma/migrations/**

sonar.tests=.
sonar.test.inclusions=\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.test.ts,\
  **/*.test.tsx

sonar.javascript.lcov.reportPaths=\
  coverage/apps/web/lcov.info,\
  coverage/apps/api-e2e/lcov.info,\
  coverage/libs/web-ui/lcov.info,\
  coverage/libs/data-browser/lcov.info,\
  coverage/libs/shared/apollo/lcov.info,\
  coverage/libs/shared/sdk/lcov.info
